services:
  - type: web
    name: ig-autoreplier
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: VERIFY_TOKEN
        generateValue: true
      - key: APP_SECRET
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
